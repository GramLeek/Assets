name: Finish Russian localization

on:
  push:
    paths:
      - '.github/workflows/fix-russian-round2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish Russian localization
        run: python3 .github/scripts/fix_ru_round2.py
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Finish Russian localization"
          git push
