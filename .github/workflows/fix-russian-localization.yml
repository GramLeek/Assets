    ["GRAMLEAKS // OPEN CASE FILE","GRAMLEAKS // ОТКРЫТОЕ ДЕЛО"],["PASTE THE CONTRACT.","ВСТАВЬ КОНТРАКТ."],["READ THE CHAIN.","ЧИТАЙ БЛОКЧЕЙН."],["Concentration, largest holder and admin state.","Концентрация, крупнейший холдер и статус админа."],["Evidence first. Drama after.","Сначала доказательства. Драма потом."],["FILE","ДЕЛО"],["UNOPENED","НЕ ОТКРЫТО"],
    ["top-wallet concentration","концентрация топ-кошельков"],["largest visible position","крупнейшая видимая позиция"],["admin and mint state","статус админа и минта"],["QUICK DISTRIBUTION SCAN","БЫСТРЫЙ СКАН РАСПРЕДЕЛЕНИЯ"],["TON jetton contract","Контракт TON jetton"],["WAITING","ОЖИДАНИЕ"],["USE $LEEK CONTRACT","ИСПОЛЬЗОВАТЬ КОНТРАКТ $LEEK"],["Public TON Center data · 1 request/second without API key","Публичные данные TON Center · 1 запрос/сек без API-ключа"],
    ["TOP 10 SHARE","ДОЛЯ ТОП-10"],["LARGEST WALLET","КРУПНЕЙШИЙ КОШЕЛЁК"],["VISIBLE WALLETS","ВИДИМЫЕ КОШЕЛЬКИ"],["CASE PENDING","ДЕЛО ОЖИДАЕТ"],["The chain has not testified yet.","Блокчейн ещё не дал показаний."],
    ["GLOBAL HIGH-SCORE WALL","ГЛОБАЛЬНАЯ ТАБЛИЦА РЕКОРДОВ"],["SHAME & GLORY","ПОЗОР И СЛАВА"],["DATABASE","БАЗА ДАННЫХ"],["CHECKING…","ПРОВЕРКА…"],["GLOBAL BEST RUN","ЛУЧШИЙ ЗАБЕГ В МИРЕ"],["GAME KILLS RECORDED","ЗАПИСАНО УБИЙСТВ"],["COMPLETED RUNS","ЗАВЕРШЁННЫЕ ЗАБЕГИ"],["Signature","Подпись"],["Country","Страна"],
    ["Global scores are written to Supabase with the public publishable key. Row-level security controls anonymous access. If the database is unavailable, your result remains local and shareable.","Глобальные результаты записываются в Supabase с публичным publishable key. Row-level security контролирует анонимный доступ. Если база недоступна, результат остаётся локальным и им можно поделиться."],
    ["WE'RE NOT A VEGETABLE.","МЫ НЕ ОВОЩ."],["WE'RE THE THING THAT EATS VEGETABLES.","МЫ ТО, ЧТО ЕСТ ОВОЩИ."],["Playable prototype. Public wallets. Chain data. No fake utility.","Играбельный прототип. Публичные кошельки. Данные блокчейна. Никакой фальшивой utility."],["PUBLIC BUILD TAPE","ПУБЛИЧНЫЙ ЖУРНАЛ СБОРОК"],
    ["Proof of play, trophy cards, case files and combat juice","Подтверждение игры, карточки результатов, дела и больше боевого драйва"],["Landscape screen recovery + clear lower combat zone","Восстановление landscape-экрана + чистая нижняя зона боя"],["Manual aim + continuous auto-fire + mobile combat pass","Ручной прицел + непрерывный автоогонь + мобильная доработка боя"],["Three-act LEEKed IN run + final boss","Трёхактный забег LEEKed IN + финальный босс"],["15M LEEK sent to the public void wallet — independent of prototype gameplay","15M LEEK отправлено в публичный void-кошелёк — отдельно от игры прототипа"],
    ["GRAMLEEK // BUILT IN PUBLIC ON GRAM","GRAMLEEK // СТРОИМ ОТКРЫТО НА GRAM"],["PLAY","ИГРАТЬ"],["PROOF","ДОКАЗАТЕЛЬСТВА"],["RANK","РЕЙТИНГ"],["COPY","КОПИРОВАТЬ"],["Quick actions","Быстрые действия"],
    ["Top-down action game. Move with WASD or left joystick, set the automatic firing direction with mouse or right pad.","Экшен с видом сверху. Двигайся WASD или левым стиком, направление автоогня задавай мышью или правым падом."],["Shareable run trophy","Карточка результата для публикации"],["Unlocked run badges","Разблокированные достижения"],["Live GramLeek impact ticker","Live-лента GramLeek"]
  ]);

  const RUNTIME_RU=new Map([
    ["FULLSCREEN ENGAGED","ПОЛНЫЙ ЭКРАН ВКЛЮЧЁН"],["RETURNED TO PAGE","ВОЗВРАТ НА СТРАНИЦУ"],["CHALLENGE DESTROYED","ВЫЗОВ УНИЧТОЖЕН"],["AUTOPSY RELEASED","РЕЗУЛЬТАТ ОПУБЛИКОВАН"],["CHALLENGE LINK COPIED","ССЫЛКА НА ВЫЗОВ СКОПИРОВАНА"],
    ["READING JETTON MASTER","ЧИТАЕМ JETTON MASTER"],["MASTER RECEIVED","MASTER ПОЛУЧЕН"],["READING HOLDER SET","ЧИТАЕМ СПИСОК ХОЛДЕРОВ"],["CALCULATING CONCENTRATION","СЧИТАЕМ КОНЦЕНТРАЦИЮ"],["CASE SEALED","ДЕЛО ЗАФИКСИРОВАНО"],["VALIDATING CONTRACT","ПРОВЕРЯЕМ КОНТРАКТ"],["SCAN FAILED","СКАН НЕ УДАЛСЯ"],
    ["WHALE ALERT","ТРЕВОГА: КИТ"],["ADMIN PRESENT","АДМИН УКАЗАН"],["ADMIN NOT RETURNED","АДМИН НЕ ВОЗВРАЩЁН API"],["MINTABLE","МИНТ ДОСТУПЕН"],["MINT DISABLED","МИНТ ОТКЛЮЧЁН"],["MINT UNKNOWN","СТАТУС МИНТА НЕИЗВЕСТЕН"],
    ["LOCAL","ЛОКАЛЬНО"],["ANON VEGETABLE","ОВОЩ-АНОНИМ"],["GLOBAL READ ONLINE","ГЛОБАЛЬНАЯ БАЗА ОНЛАЙН"],["GLOBAL READ OFFLINE","ГЛОБАЛЬНАЯ БАЗА ОФЛАЙН"],
    ["FIRST KILL","ПЕРВОЕ УБИЙСТВО"],["70%+ ACCURACY","ТОЧНОСТЬ 70%+"],["POOL UNTOUCHED","ПУЛ НЕ ТРОНУТ"],["SURVIVED ADMIN 64H","ПЕРЕЖИЛ ADMIN 64H"],["RUN RECORDED","ЗАБЕГ ЗАПИСАН"],
    ["NO EXIT","ВЫХОДА НЕТ"],["PAID","ПРОПЛАЧЕНО"],["OPINIONS FACTORY","ФАБРИКА МНЕНИЙ"],["SLEEPING ADMIN // SHOOT TO WAKE","СПЯЩИЙ АДМИН // СТРЕЛЯЙ, ЧТОБЫ РАЗБУДИТЬ"],["CABAL SHIELD","ЩИТ CABAL"],["STOLEN","УКРАДЕНО"],
    ["GRAMLEEK // RUN AUTOPSY","GRAMLEEK // ВСКРЫТИЕ ЗАБЕГА"],["DEN CLEARED","ЛОГОВО ЗАЧИЩЕНО"],["RUGGED","ЗАРАГАЛИ"],["SURVIVAL","ВЫЖИВАНИЕ"],["CAUSE OF DEATH / FINAL WITNESS","ПРИЧИНА ПОРАЖЕНИЯ / ПОСЛЕДНИЙ СВИДЕТЕЛЬ"],["BEAT THIS VEGETABLE →","ПОБЕДИ ЭТОТ ОВОЩ →"],["PROTOTYPE // GAMEPLAY DOES NOT BURN LEEK","ПРОТОТИП // ИГРА НЕ СЖИГАЕТ LEEK"],
    ["HOSTILE SHILL","ВРАЖДЕБНЫЙ ШИЛЛ"],["PAID KOL PROJECTILE","СНАРЯД ПРОПЛАЧЕННОГО KOL"],["PAID KOL HIT THE POOL","ПРОПЛАЧЕННЫЙ KOL ПОПАЛ В ПУЛ"],["RUGGED FLOOR","RUG-ПОЛ"],["RUG REACHED LIQUIDITY","RUG ДОБРАЛСЯ ДО ЛИКВИДНОСТИ"],["JEET STOLE THE LIQUIDITY","JEET УКРАЛ ЛИКВИДНОСТЬ"],["JEET ESCAPED","JEET СБЕЖАЛ"],["LIQUIDITY DRAINED","ЛИКВИДНОСТЬ ВЫКАЧАНА"]
  ]);

  const RU_DOM=new Map([...STATIC_RU,...RUNTIME_RU]);
  const EN_DOM=new Map([...RU_DOM].map(([en,ru])=>[ru,en]));

  function uiText(value){
    const text=String(value??"");
    if(currentLang!=="ru")return text;
    const exact=RU_DOM.get(text);if(exact)return exact;
    let match=text.match(/^Largest visible wallet controls ([0-9.]+)%\. Inspect it before inventing a verdict\.$/);
    if(match)return `Крупнейший видимый кошелёк контролирует ${match[1]}%. Проверь его, прежде чем выносить вердикт.`;
    return text;
  }

  function applyStaticLanguage(lang){
    const map=lang==="ru"?RU_DOM:EN_DOM;
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
      acceptNode(node){
        const parent=node.parentElement;if(!parent||["SCRIPT","STYLE","NOSCRIPT"].includes(parent.tagName))return NodeFilter.FILTER_REJECT;
        return node.nodeValue&&node.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
      }
    });
    while(walker.nextNode()){
      const node=walker.currentNode,raw=node.nodeValue,match=raw.match(/^(\s*)([\s\S]*?)(\s*)$/),core=match?match[2]:raw;
      const translated=lang==="ru"?uiText(core):(map.get(core)||core);
      if(translated!==core)node.nodeValue=(match?match[1]:"")+translated+(match?match[3]:"");
    }
    document.querySelectorAll("[aria-label],[title],[placeholder]").forEach(el=>{
      for(const attr of ["aria-label","title","placeholder"]){
        if(!el.hasAttribute(attr))continue;const value=el.getAttribute(attr),translated=lang==="ru"?uiText(value):(map.get(value)||value);if(translated!==value)el.setAttribute(attr,translated);
      }
    });
    document.title=lang==="ru"?"GramLeek — LEEKed IN // прототип":"GramLeek — LEEKed IN";
    const meta=document.querySelector('meta[name="description"]');
    if(meta)meta.content=lang==="ru"?"Играй в публичный прототип LEEKed IN на GRAM. Сейчас gameplay работает off-chain, а механика сжигания токена ещё не активна. Публичные данные TON-кошельков показаны отдельно.":"Play the public prototype of LEEKed IN on GRAM. Gameplay is off-chain for now; the token-burn mechanic is not live. Public TON wallet data is shown separately.";
  }
'''
          rep('  const tr=key=>TEXT[currentLang][key];\n', '  const tr=key=>TEXT[currentLang][key];\n' + helper + '\n')

          # Route generic UI notifications through the active language.
          rep('    el.textContent=message;\n', '    el.textContent=uiText(message);\n')
          rep('    const el=$("gameBanner");el.textContent=text;el.classList.add("show");', '    const el=$("gameBanner");el.textContent=uiText(text);el.classList.add("show");')
          rep('    state.floaters.push({x,y,text,color,size,life:.85,maxLife:.85});', '    state.floaters.push({x,y,text:uiText(text),color,size,life:.85,maxLife:.85});')

          # Localize canvas-only labels.
          rep('ctx.fillText("NO EXIT",68,99);', 'ctx.fillText(uiText("NO EXIT"),68,99);')
          rep('ctx.fillText("PAID",0,0);', 'ctx.fillText(uiText("PAID"),0,0);')
          rep('ctx.fillText("OPINIONS FACTORY",-33,28);', 'ctx.fillText(uiText("OPINIONS FACTORY"),-33,28);')
          rep('ctx.fillText("LIQUIDITY",0,-2);', 'ctx.fillText(uiText("LIQUIDITY"),0,-2);')
          rep('ctx.fillText(boss.sleep>0?"SLEEPING ADMIN // SHOOT TO WAKE":"ADMIN_64H",W/2,y-4);', 'ctx.fillText(boss.sleep>0?uiText("SLEEPING ADMIN // SHOOT TO WAKE"):"ADMIN_64H",W/2,y-4);')

          # Share-card canvas, badges, share text and end screen.
          rep('c.fillText("GRAMLEEK // RUN AUTOPSY",66,72);', 'c.fillText(uiText("GRAMLEEK // RUN AUTOPSY"),66,72);')
          rep('c.fillText(run.boss?"DEN CLEARED":"RUGGED",58,197);', 'c.fillText(run.boss?uiText("DEN CLEARED"):uiText("RUGGED"),58,197);')
          rep('c.fillText("SCORE",66,337);', 'c.fillText(uiText("SCORE"),66,337);')
          rep('c.fillText("KILLS",340,337);', 'c.fillText(uiText("KILLS"),340,337);')
          rep('c.fillText("SURVIVAL",555,337);', 'c.fillText(uiText("SURVIVAL"),555,337);')
          rep('c.fillText("LIQUIDITY",805,337);', 'c.fillText(uiText("LIQUIDITY"),805,337);')
          rep('c.fillText("CAUSE OF DEATH / FINAL WITNESS",66,405);', 'c.fillText(uiText("CAUSE OF DEATH / FINAL WITNESS"),66,405);')
          rep('cardText(c,run.cause,66,450,760,43);', 'cardText(c,uiText(run.cause),66,450,760,43);')
          rep('c.fillText("BEAT THIS VEGETABLE →",66,548);', 'c.fillText(uiText("BEAT THIS VEGETABLE →"),66,548);')
          rep('c.fillText("PROTOTYPE // GAMEPLAY DOES NOT BURN LEEK",1136,582);', 'c.fillText(uiText("PROTOTYPE // GAMEPLAY DOES NOT BURN LEEK"),1136,582);')
          rep('    const badges=[];\n', '    const badges=[];\n')
          rep('${escapeHtml(label)}</span>`).join("");', '${escapeHtml(uiText(label))}</span>`).join("");')
          rep('$("gameOverKicker").textContent=victory?tr("victory"):"RUN AUTOPSY";', '$("gameOverKicker").textContent=victory?tr("victory"):uiText("RUN AUTOPSY");')

          old_share = '  async function shareRun(){\n    if(!lastCompletedRun)return;const run=lastCompletedRun,link=challengeUrl(run),text=`LEEKed IN: ${run.score.toLocaleString()} score · ${run.kills} kills. Beat this vegetable.`;'
          new_share = '  async function shareRun(){\n    if(!lastCompletedRun)return;const run=lastCompletedRun,link=challengeUrl(run),text=currentLang==="ru"?`LEEKed IN: ${run.score.toLocaleString()} очков · ${run.kills} убийств. Победи этот овощ.`:`LEEKed IN: ${run.score.toLocaleString()} score · ${run.kills} kills. Beat this vegetable.`;'
          rep(old_share,new_share)
          rep('await navigator.share({title:"LEEKed IN — Run Autopsy",text,url:link,files:[file]});', 'await navigator.share({title:currentLang==="ru"?"LEEKed IN — Итог забега":"LEEKed IN — Run Autopsy",text,url:link,files:[file]});')
          old_x = '    const lead=run.boss?"I survived Admin 64H.":`I got rugged after ${run.kills} kills.`;\n    const text=`${lead} ${run.score.toLocaleString()} score in LEEKed IN. Beat this vegetable.`;'
          new_x = '    const lead=currentLang==="ru"?(run.boss?"Я пережил Admin 64H.":`Меня зарагали после ${run.kills} убийств.`):(run.boss?"I survived Admin 64H.":`I got rugged after ${run.kills} kills.`);\n    const text=currentLang==="ru"?`${lead} ${run.score.toLocaleString()} очков в LEEKed IN. Победи этот овощ.`:`${lead} ${run.score.toLocaleString()} score in LEEKed IN. Beat this vegetable.`;'
          rep(old_x,new_x)

          # Impact area: dynamic labels/logs must switch cleanly both ways.
          rep('$("impactGlobalKills").textContent=globalDataReady?Math.round(Number(globalStats.totalBurned)||0).toLocaleString():"CONNECTING";', '$("impactGlobalKills").textContent=globalDataReady?Math.round(Number(globalStats.totalBurned)||0).toLocaleString():uiText("CONNECTING");')
          rep('$("impactLastScore").textContent=last?Math.round(last.score).toLocaleString():"NONE";', '$("impactLastScore").textContent=last?Math.round(last.score).toLocaleString():uiText("NONE");')
          rep('$("impactLogText").innerHTML=`<b>RUN ${escapeHtml(hash)}</b> · ${Math.round(last.score).toLocaleString()} SCORE · ${last.kills} KILLS · ${last.pool}% LIQUIDITY`;', '$("impactLogText").innerHTML=currentLang==="ru"?`<b>ЗАБЕГ ${escapeHtml(hash)}</b> · ${Math.round(last.score).toLocaleString()} ОЧКОВ · ${last.kills} УБИЙСТВ · ${last.pool}% ЛИКВИДНОСТИ`:`<b>RUN ${escapeHtml(hash)}</b> · ${Math.round(last.score).toLocaleString()} SCORE · ${last.kills} KILLS · ${last.pool}% LIQUIDITY`;')
          rep('$("impactLogText").innerHTML="<b>WAITING FOR A RUN.</b> Nothing invented. Nothing pending.";', '$("impactLogText").innerHTML=currentLang==="ru"?"<b>ЖДЁМ ЗАБЕГ.</b> Ничего не выдумано. Ничего не ожидается.":"<b>WAITING FOR A RUN.</b> Nothing invented. Nothing pending.";')

          # Russian ticker strings were still visibly mixed with English.
          rep('      `ЭТОТ RUN: ${kills} УБИЙСТВ`,', '      `ЭТОТ ЗАБЕГ: ${kills} УБИЙСТВ`,')
          rep('      burnDataReady?`VOID WALLET: ${human(liveBurned)} LEEK // GAMEPLAY НЕ ПОДКЛЮЧЕН`:"VOID WALLET: ПОДКЛЮЧЕНИЕ",', '      burnDataReady?`VOID-КОШЕЛЁК: ${human(liveBurned)} LEEK // ИГРА НЕ ПОДКЛЮЧЕНА`:"VOID-КОШЕЛЁК: ПОДКЛЮЧЕНИЕ",')
          rep('      globalDataReady?`ВСЕ RUNS: ${human(total)} УБИЙСТВ`:"GLOBAL RUNS: ПОДКЛЮЧЕНИЕ",', '      globalDataReady?`ВСЕ ЗАБЕГИ: ${human(total)} УБИЙСТВ`:"ВСЕ ЗАБЕГИ: ПОДКЛЮЧЕНИЕ",')
          rep('      last?`ПОСЛЕДНИЙ RUN: ${Math.round(Number(last.score)||0).toLocaleString()} SCORE · ${Math.round(Number(last.kills)||0)} KILLS`:"ПОСЛЕДНИЙ RUN: НЕТ"', '      last?`ПОСЛЕДНИЙ ЗАБЕГ: ${Math.round(Number(last.score)||0).toLocaleString()} ОЧКОВ · ${Math.round(Number(last.kills)||0)} УБИЙСТВ`:"ПОСЛЕДНИЙ ЗАБЕГ: НЕТ"')

          # Scanner runtime output.
          rep('$("scanProgressLabel").textContent=label;', '$("scanProgressLabel").textContent=uiText(label);')
          rep('  function renderScan(data){\n', '  let lastScanData=null;\n\n  function renderScan(data){\n    lastScanData=data;\n')
          rep('    const whale=data.largest>10;if(whale){title="WHALE ALERT";copy=`Largest visible wallet controls ${data.largest.toFixed(2)}%. Inspect it before inventing a verdict.`}\n', '    const whale=data.largest>10;if(whale){title=uiText("WHALE ALERT");copy=currentLang==="ru"?`Крупнейший видимый кошелёк контролирует ${data.largest.toFixed(2)}%. Проверь его, прежде чем выносить вердикт.`:`Largest visible wallet controls ${data.largest.toFixed(2)}%. Inspect it before inventing a verdict.`}\n')
          old_meta = '    const supply=data.totalRaw/(10**data.decimals),admin=data.admin?"ADMIN PRESENT":"ADMIN NOT RETURNED",mint=data.mintable===true?"MINTABLE":data.mintable===false?"MINT DISABLED":"MINT UNKNOWN";\n    $("scanMeta").textContent=`${data.name} (${data.symbol}) · issued ${human(supply)} · ${admin} · ${mint} · concentration: ${level}`;'
          new_meta = '    const supply=data.totalRaw/(10**data.decimals),admin=uiText(data.admin?"ADMIN PRESENT":"ADMIN NOT RETURNED"),mint=uiText(data.mintable===true?"MINTABLE":data.mintable===false?"MINT DISABLED":"MINT UNKNOWN"),levelText=currentLang==="ru"?({Low:"низкая",Mid:"средняя",High:"высокая"}[level]||level):level;\n    $("scanMeta").textContent=currentLang==="ru"?`${data.name} (${data.symbol}) · выпущено ${human(supply)} · ${admin} · ${mint} · концентрация: ${levelText}`:`${data.name} (${data.symbol}) · issued ${human(supply)} · ${admin} · ${mint} · concentration: ${levelText}`;'
          rep(old_meta,new_meta)
          rep('button.disabled=true;button.textContent="SCANNING…";', 'button.disabled=true;button.textContent=uiText("SCANNING…");')

          # Ranking dynamic entries and DB state.
          rep('el.innerHTML=`DATABASE<b>${escapeHtml(ok?tr("dbOnline"):tr("dbError"))}</b>`;', 'el.innerHTML=`${uiText("DATABASE")}<b>${escapeHtml(uiText(ok?tr("dbOnline"):tr("dbError")))}</b>`;')
          rep('        <div class="rank-pos">${row.local?"LOCAL":"#"+(index+1)}</div>\n        <div class="rank-name">${escapeHtml(row.name||"ANON VEGETABLE")}</div>', '        <div class="rank-pos">${row.local?uiText("LOCAL"):"#"+(index+1)}</div>\n        <div class="rank-name">${escapeHtml(row.name||uiText("ANON VEGETABLE"))}</div>')

          # Refresh language-sensitive dynamic UI when switching languages.
          old_tail = '    renderImpact();refreshHud();renderRanking();\n  }'
          new_tail = '''    renderImpact();refreshHud();renderRanking();
    if(lastScanData)renderScan(lastScanData);
    if(lastCompletedRun){
      if(!$("gameOverScreen").classList.contains("hidden")){
        $("gameOverKicker").textContent=lastCompletedRun.boss?tr("victory"):uiText("RUN AUTOPSY");
        $("gameOverTitle").textContent=lastCompletedRun.boss?tr("cleared"):lastCompletedRun.pool<=0?tr("liquidityGone"):tr("rugged");
        $("gameOverText").innerHTML=tr("runText")(lastCompletedRun);
      }
      renderShareCard(lastCompletedRun,$("trophyPreview"));renderRunBadges(lastCompletedRun);
    }
    applyStaticLanguage(currentLang);
  }'''
          rep(old_tail,new_tail)

          path.write_text(s, encoding='utf-8')

          # Syntax-check the inline app script before committing.
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', s)
          inline = max(scripts, key=len)
          js = Path('/tmp/gramleek-inline.js')
          js.write_text(inline, encoding='utf-8')
          subprocess.run(['node','--check',str(js)], check=True)
          print('Russian localization patch applied and JavaScript syntax is valid.')
          PY

      - name: Commit localization fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Complete Russian localization"
          git push
