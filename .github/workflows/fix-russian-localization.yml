name: Fix Russian localization

on:
  push:
    paths:
      - '.github/workflows/fix-russian-localization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete Russian localization
        run: python3 .github/scripts/fix_ru.py
      - name: Commit localization fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Complete Russian localization"
          git push
