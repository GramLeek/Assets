name: Validate LEEKed IN v1

on:
  push:
    paths:
      - '.github/workflows/validate-leeked-v1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: leeked-in-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
