name: Fix Russian localization

on:
  push:
    paths:
      - '.github/workflows/fix-russian-localization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete Russian localization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          def rep(old, new, expected=1):
              global s
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              s = s.replace(old, new, expected)

          # Russian-only CSS for the pseudo-element ribbon.
          rep('  </style>\n</head>', '    html[lang="ru"] .game-terminal::before{content:"НАСТОЯЩАЯ ИГРА // БЕЗ AI-ТРЕЙЛЕРА"}\n  </style>\n</head>')

          # Improve a few existing Russian dictionary strings that still contained obvious English leftovers.
          rep('live:"УБИЙСТВ В RUN"', 'live:"УБИЙСТВ В ЗАБЕГЕ"')
          rep('tag1:"ЕЖЕДНЕВНЫЙ ОДИНАКОВЫЙ RUN"', 'tag1:"ЕЖЕДНЕВНЫЙ ФИКСИРОВАННЫЙ ЗАБЕГ"')
          rep('terminal:"DAILY RUN // АВТООГОНЬ ГОТОВ"', 'terminal:"ЕЖЕДНЕВНЫЙ ЗАБЕГ // АВТООГОНЬ ГОТОВ"')
          rep('finish:"Заверши run, чтобы открыть отправку результата."', 'finish:"Заверши забег, чтобы отправить результат."')
          rep('share:"ПОДЕЛИТЬСЯ TROPHY"', 'share:"ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ"')
          rep('runReady:r=>`Run сохранён: ${r.score.toLocaleString()} очков · ${r.kills} убийств. Добавь подпись и страну.`', 'runReady:r=>`Забег зафиксирован: ${r.score.toLocaleString()} очков · ${r.kills} убийств. Добавь подпись и страну.`')
          rep('verifying:"Сохраняем run…",verified:"Run принят. Позор стал глобальным.",verifyError:"База отклонила run. Результат остаётся локальным и доступным для sharing."', 'verifying:"Сохраняем забег…",verified:"Забег принят. Позор стал глобальным.",verifyError:"База отклонила забег. Результат остаётся локальным, им можно поделиться."')
          rep('dbOnline:"GLOBAL READ ONLINE",dbError:"GLOBAL READ OFFLINE",empty:"ПОКА НЕТ ПОДТВЕРЖДЁННЫХ RUNS."', 'dbOnline:"ГЛОБАЛЬНАЯ БАЗА ОНЛАЙН",dbError:"ГЛОБАЛЬНАЯ БАЗА ОФЛАЙН",empty:"ПОКА НЕТ ПОДТВЕРЖДЁННЫХ ЗАБЕГОВ."')
          rep('runText:r=>`Убийства: <b>${r.kills}</b> · Счёт: <b>${r.score.toLocaleString()}</b> · Время: <b>${formatTime(r.duration)}</b><br>Причина: <b>${escapeHtml(r.cause)}</b>`', 'runText:r=>`Убийства: <b>${r.kills}</b> · Счёт: <b>${r.score.toLocaleString()}</b> · Время: <b>${formatTime(r.duration)}</b><br>Причина: <b>${escapeHtml(uiText(r.cause))}</b>`')

          helper = r'''
  const STATIC_RU=new Map([
    ["SKIP","ПРОПУСТИТЬ"],["PROTOTYPE","ПРОТОТИП"],["VOID WALLET DATA","ДАННЫЕ VOID-КОШЕЛЬКА"],["READ-ONLY","ТОЛЬКО ЧТЕНИЕ"],["GLOBAL RANKING","ГЛОБАЛЬНЫЙ РЕЙТИНГ"],["CONNECTING","ПОДКЛЮЧЕНИЕ"],["READY","ГОТОВО"],
    ["Skip to game","Перейти к игре"],["GramLeek home","Главная GramLeek"],["GAME // PROTOTYPE // CHAIN DATA","ИГРА // ПРОТОТИП // ДАННЫЕ БЛОКЧЕЙНА"],["PUBLIC PROTOTYPE","ПУБЛИЧНЫЙ ПРОТОТИП"],["// BUILDING IN THE OPEN","// СТРОИМ ОТКРЫТО"],["TRADE","ТОРГОВАТЬ"],["CAFÉ","КАФЕ"],
    ["Add game to home screen","Добавить игру на главный экран"],["Toggle sound","Включить или выключить звук"],["Language","Язык"],["Game features","Особенности игры"],["Token links","Ссылки токена"],["LEEKed IN game","Игра LEEKed IN"],
    ["TRADE ON DeDust →","ТОРГОВАТЬ НА DeDust →"],["LEEK CAFÉ →","LEEK КАФЕ →"],["INITIALIZING RUN","ЗАПУСК ЗАБЕГА"],["LOADING DAILY SEED // ARMING AUTO-FIRE","ЗАГРУЖАЕМ DAILY SEED // ВКЛЮЧАЕМ АВТООГОНЬ"],
    ["SCORE","СЧЁТ"],["KILLS","УБИЙСТВА"],["COMBO","КОМБО"],["GAME BURN","СЖИГАНИЕ ИГРОЙ"],["NOT LIVE","НЕ АКТИВНО"],["LIQUIDITY","ЛИКВИДНОСТЬ"],["LOCKED IN","ЗАЛОЧЕНО"],["DAILY CASE //","ЕЖЕДНЕВНОЕ ДЕЛО //"],
    ["TRANSMISSION INTERRUPTED","ПЕРЕДАЧА ПРЕРВАНА"],["PAUSED.","ПАУЗА."],["The den waits. Unfortunately, so does the admin.","Логово подождёт. К сожалению, админ тоже."],["RESUME →","ПРОДОЛЖИТЬ →"],["RUN AUTOPSY","ВСКРЫТИЕ ЗАБЕГА"],["The vegetable has fallen.","Овощ пал."],["POST ON X","ОПУБЛИКОВАТЬ В X"],
    ["RUN KILLS","УБИЙСТВА В ЗАБЕГЕ"],["BEST COMBO","ЛУЧШЕЕ КОМБО"],["ACCURACY","ТОЧНОСТЬ"],["RUN TIME","ВРЕМЯ ЗАБЕГА"],
    ["PROTOTYPE TELEMETRY","ТЕЛЕМЕТРИЯ ПРОТОТИПА"],["THE GAME LEAVES A SCORE.","ИГРА ОСТАВЛЯЕТ СЧЁТ."],["Kills are gameplay data only. This prototype does not burn LEEK or trigger token transactions. The burn mechanic is planned, not live.","Убийства — только игровые данные. Этот прототип не сжигает LEEK и не создаёт транзакций токена. Механика сжигания запланирована, но пока не активна."],
    ["THIS RUN // KILLS","ЭТОТ ЗАБЕГ // УБИЙСТВА"],["GAME BURN STATUS","СТАТУС СЖИГАНИЯ ИГРОЙ"],["ALL RECORDED KILLS","ВСЕ ЗАПИСАННЫЕ УБИЙСТВА"],["LAST SEALED RUN","ПОСЛЕДНИЙ ЗАФИКСИРОВАННЫЙ ЗАБЕГ"],["NONE","НЕТ"],["WAITING FOR A RUN.","ЖДЁМ ЗАБЕГ."],["Nothing invented. Nothing pending.","Ничего не выдумано. Ничего не ожидается."],
    ["ON-CHAIN DATA // SEPARATE FROM GAME","ON-CHAIN ДАННЫЕ // ОТДЕЛЬНО ОТ ИГРЫ"],["DEV WALLET","КОШЕЛЁК DEV"],["COMMUNITY FUND","ФОНД СООБЩЕСТВА"],["VOID WALLET","VOID-КОШЕЛЁК"],["SCANNING…","СКАНИРУЕМ…"],["SUPPLY DIAGNOSTICS","ДИАГНОСТИКА ЭМИССИИ"],["CURRENT EFFECTIVE SUPPLY","ТЕКУЩАЯ ЭФФЕКТИВНАЯ ЭМИССИЯ"],["reading the void wallet…","читаем void-кошелёк…"],
