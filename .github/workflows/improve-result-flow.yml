name: Improve result flow UX

on:
  push:
    paths:
      - '.github/workflows/improve-result-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup current page
        run: |
          mkdir -p backups
          cp index.html backups/index-before-result-share-ux-2026-09-04.html
      - name: Improve result flow
        run: python3 .github/scripts/improve_result_flow.py
      - name: Commit backup and UX changes
        run: |
          git config user.name "GramLeek"
          git config user.email "actions@users.noreply.github.com"
          git add index.html backups/index-before-result-share-ux-2026-09-04.html
          git commit -m "Improve post-run ranking and sharing UX"
          git push
