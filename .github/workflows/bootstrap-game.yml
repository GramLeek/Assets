name: Bootstrap LEEKed IN 1.0

on:
  push:
    branches: [leeked-in-v1]
    paths:
      - '.github/workflows/bootstrap-game.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace branch tree with clean game project
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          echo '' | base64 -d | tar -xzf -
          git config user.name 'GramLeek'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Initialize LEEKed IN 1.0 Phaser vertical slice'
          git push
