name: Fix Russian burn label typo

on:
  push:
    paths:
      - '.github/workflows/fix-ru-burn-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix label and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if s.count('СЖЕЖЕНО') != 1:
              raise SystemExit('Unexpected typo occurrence count')
          p.write_text(s.replace('СЖЕЖЕНО','СОЖЖЕНО'),encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          inline='\n'.join(x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I) if x.strip() and 'telegram.org/js/' not in x)
          Path('/tmp/check.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/check.js
      - name: Commit
        run: |
          git config user.name "GramLeek"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Russian burned label"
          git push
